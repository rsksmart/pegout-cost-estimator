name: CI/CD Using Github actions workflow
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Node & Npm Version
        run: |                   
            node -v
            npm -v

      - name: Install 🔧
        run: npm install

      - name: Test 🚨
        run: npm run test
